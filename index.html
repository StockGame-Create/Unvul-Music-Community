<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNVUL MUSIC - 커뮤니티 업로드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .warning {
            background: rgba(255, 100, 100, 0.2);
            border: 2px solid rgba(255, 100, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info {
            background: rgba(100, 200, 255, 0.2);
            border: 2px solid rgba(100, 200, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        input[type="text"],
        input[type="file"],
        input[type="color"],
        select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1em;
        }

        input[type="color"] {
            height: 60px;
            cursor: pointer;
        }
        
        input[type="file"] {
            cursor: pointer;
        }
        
        select {
            cursor: pointer;
        }
        
        select option {
            background: #1a1a2e;
            color: white;
        }
        
        .file-info {
            margin-top: 10px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .color-picker-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .color-preview {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            margin-top: 15px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress {
            display: none;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .status {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9em;
        }
        
        .success {
            background: rgba(100, 255, 100, 0.2);
            border: 2px solid rgba(100, 255, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 2px solid rgba(255, 100, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        /* 스타일 버튼 */
        .style-btn {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            font-weight: 600;
        }

        .style-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .style-btn.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        /* 체크박스 스타일링 */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        /* 랜덤 버튼 */
        #randomizeBtn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        #randomizeBtn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 돌아가기 버튼 */
        #backBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #backBtn:active {
            transform: translateY(0);
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            #backBtn {
                display: block !important;
                width: 100%;
                padding: 15px 20px !important;
                font-size: 1em !important;
                box-sizing: border-box;
            }
            
            .style-btn {
                padding: 10px 12px;
                font-size: 0.85em;
            }
            
            .color-preview {
                height: 200px;
                font-size: 2.5em;
            }
        }
    </style>
</head>

  <div class="form-group">

</div>
            
            <div class="form-group">
                <label>앨범 아트 커스텀</label>
                
                <!-- 스타일 선택 -->
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 0.95em; margin-bottom: 10px;">디자인 스타일</label>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;">
                        <button type="button" class="style-btn active" data-style="gradient">
                            🌈 그라데이션
                        </button>
                        <button type="button" class="style-btn" data-style="solid">

                <!-- 색상 선택 -->

                    </div>

                <!-- 텍스트 옵션 -->
                <div style="margin-top: 20px;">
                    <label style="font-size: 0.95em; margin-bottom: 10px;">텍스트 설정</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">

                            <input type="checkbox" id="addGlow" checked>
                            <span>★ 그림자</span>
                        </label>
                  <label style="display: flex; align-items: center; gap: 8px; padding: 10px 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; opacity: 0.5; pointer-events: none;">
    <input type="checkbox" id="addNoise" disabled>
    <span> 노이즈 (테스트중)</span>
</label>
<label style="display: flex; align-items: center; gap: 8px; padding: 10px 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; opacity: 0.5; pointer-events: none;">
    <input type="checkbox" id="addBorder" disabled>
    <span> 테두리 (테스트중)</span>
</label>
                    </div>
                </div>
                
                <!-- 미리보기 -->

            <button type="submit" class="btn" id="uploadBtn">▷ 업로드 시작</button>

        <div class="progress" id="progressDiv">

                <div class="progress-fill" id="progressFill">0%</div>

        <div class="success" id="successDiv">

    <script>

 
let uploadMethod = 'file'; // 추가

// 업로드 방식 전환
document.getElementById('uploadMethodFile').addEventListener('click', function() {
    uploadMethod = 'file';
    document.getElementById('uploadMethodFile').classList.add('active');
    document.getElementById('uploadMethodYoutube').classList.remove('active');
    document.getElementById('fileUploadSection').style.display = 'block';
    document.getElementById('youtubeUploadSection').style.display = 'none';
    document.getElementById('mp3File').required = true;
    document.getElementById('youtubeUrl').required = false;
});

document.getElementById('uploadMethodYoutube').addEventListener('click', function() {
    uploadMethod = 'youtube';
    document.getElementById('uploadMethodYoutube').classList.add('active');
    document.getElementById('uploadMethodFile').classList.remove('active');
    document.getElementById('fileUploadSection').style.display = 'none';
    document.getElementById('youtubeUploadSection').style.display = 'block';
    document.getElementById('mp3File').required = false;
    document.getElementById('youtubeUrl').required = true;
});

// 유튜브 링크 검증
document.getElementById('youtubeUrl').addEventListener('input', (e) => {
    const url = e.target.value;
    const youtubeRegex = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+$/;
    
    if (url && youtubeRegex.test(url)) {
        document.getElementById('youtubeInfo').innerHTML = '✅ 유효한 유튜브 링크';
        document.getElementById('youtubeInfo').style.color = 'rgba(100, 255, 100, 0.8)';
    } else if (url) {
        document.getElementById('youtubeInfo').innerHTML = '⚠️ 올바른 유튜브 링크를 입력하세요';
        document.getElementById('youtubeInfo').style.color = 'rgba(255, 100, 100, 0.8)';
    } else {
        document.getElementById('youtubeInfo').innerHTML = '';
    }
});


        // 개발자 도구 감지 및 차단
      

       const API_URL = 'https://unvulmus-community.vercel.app/api/upload';
const YOUTUBE_API_URL = 'https://unvulmus-community.vercel.app/api/youtube'; 
        let currentStyle = 'gradient';

        // 스타일 버튼 이벤트
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentStyle = this.dataset.style;
                
                const color2Container = document.getElementById('color2Container');
                color2Container.style.display = currentStyle === 'solid' ? 'none' : 'block';
                
                updateColorPreview();
            });
        });

        // 텍스트 타입 변경
        document.getElementById('textType').addEventListener('change', function() {
            const customContainer = document.getElementById('customTextContainer');
            customContainer.style.display = this.value === 'custom' ? 'block' : 'none';
            updateColorPreview();
        });

        // 텍스트 크기 슬라이더
        document.getElementById('textSize').addEventListener('input', function() {
            document.getElementById('textSizeValue').textContent = this.value;
            updateColorPreview();
        });

        // 효과 체크박스
        ['addGlow', 'addNoise', 'addBorder'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateColorPreview);
        });

        // 커스텀 텍스트 입력
        document.getElementById('customText').addEventListener('input', updateColorPreview);

        // 색상 변경
        document.getElementById('color1').addEventListener('input', updateColorPreview);
        document.getElementById('color2').addEventListener('input', updateColorPreview);

        // 랜덤 생성
        document.getElementById('randomizeBtn').addEventListener('click', () => {
            const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            document.getElementById('color1').value = randomColor();
            document.getElementById('color2').value = randomColor();
            
            const styles = ['gradient', 'solid', 'pattern', 'circle'];
            const randomStyleIndex = Math.floor(Math.random() * styles.length);
            document.querySelectorAll('.style-btn')[randomStyleIndex].click();
            
            const randomSize = Math.floor(Math.random() * 150) + 100;
            document.getElementById('textSize').value = randomSize;
            document.getElementById('textSizeValue').textContent = randomSize;
            
            updateColorPreview();
        });

        // 미리보기 업데이트
        function updateColorPreview() {
            const preview = document.getElementById('colorPreview');
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;
            const textType = document.getElementById('textType').value;
            const customText = document.getElementById('customText').value;
            const songTitle = document.getElementById('songTitle').value || 'S';
            
            // 배경 스타일
            switch(currentStyle) {
                case 'gradient':
                    preview.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
                    break;
                case 'solid':
                    preview.style.background = color1;
                    break;
                case 'pattern':
                    preview.style.background = `repeating-linear-gradient(45deg, ${color1}, ${color1} 20px, ${color2} 20px, ${color2} 40px)`;
                    break;
                case 'circle':
                    preview.style.background = `radial-gradient(circle, ${color1}, ${color2})`;
                    break;
            }
            
            // 텍스트
            let displayText = '';
            switch(textType) {
                case 'first':
                    displayText = songTitle.charAt(0).toUpperCase();
                    break;
                case 'icon':
                    displayText = '🎵';
                    break;
                case 'custom':
                    displayText = customText || '♪';
                    break;
            }
            preview.textContent = displayText;
            
            // 효과
            const addGlow = document.getElementById('addGlow').checked;
            const addBorder = document.getElementById('addBorder').checked;
            
            preview.style.textShadow = addGlow ? '0 0 30px rgba(0,0,0,0.5), 0 0 60px rgba(0,0,0,0.3)' : 'none';
            preview.style.border = addBorder ? '5px solid rgba(255, 255, 255, 0.3)' : '3px solid rgba(255, 255, 255, 0.3)';
        }

        // 파일 정보 표시
    // 파일 정보 표시
        document.getElementById('mp3File').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                document.getElementById('mp3Info').textContent = `📁 ${file.name} (${sizeMB}MB)`;
                
                if (file.size > 4.4 * 1024 * 1024) {
                    alert('⚠️ 파일이 너무 큽니다!\n4.5MB 이하 파일을 선택해주세요.\n(약 4분까지 가능합니다)');
                    e.target.value = '';
                    document.getElementById('mp3Info').textContent = '';
                }
            }
        });

        // 개선된 앨범 아트 생성
        async function generateAlbumArt(color1, color2, title) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 500;
                canvas.height = 500;
                const ctx = canvas.getContext('2d');
                
                const textType = document.getElementById('textType').value;
                const customText = document.getElementById('customText').value;
                const textSize = parseInt(document.getElementById('textSize').value);
                const addGlow = document.getElementById('addGlow').checked;
                const addNoise = document.getElementById('addNoise').checked;
                const addBorder = document.getElementById('addBorder').checked;
                
                // 배경 그리기
                switch(currentStyle) {
                    case 'gradient':
                        const gradient = ctx.createLinearGradient(0, 0, 500, 500);
                        gradient.addColorStop(0, color1);
                        gradient.addColorStop(1, color2);
                        ctx.fillStyle = gradient;
                        ctx.fillRect(0, 0, 500, 500);
                        break;
                    case 'solid':
                        ctx.fillStyle = color1;
                        ctx.fillRect(0, 0, 500, 500);
                        break;
                    case 'pattern':
                        const patternCanvas = document.createElement('canvas');
                        patternCanvas.width = 40;
                        patternCanvas.height = 40;
                        const pCtx = patternCanvas.getContext('2d');
                        pCtx.fillStyle = color1;
                        pCtx.fillRect(0, 0, 40, 40);
                        pCtx.fillStyle = color2;
                        pCtx.fillRect(0, 0, 20, 20);
                        pCtx.fillRect(20, 20, 20, 20);
                        const pattern = ctx.createPattern(patternCanvas, 'repeat');
                        ctx.fillStyle = pattern;
                        ctx.fillRect(0, 0, 500, 500);
                        break;
                    case 'circle':
                        const radialGradient = ctx.createRadialGradient(250, 250, 0, 250, 250, 350);
                        radialGradient.addColorStop(0, color1);
                        radialGradient.addColorStop(1, color2);
                        ctx.fillStyle = radialGradient;
                        ctx.fillRect(0, 0, 500, 500);
                        break;
                }
                
                // 장식 원들
                if (currentStyle !== 'pattern') {
                    for (let i = 0; i < 12; i++) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.1})`;
                        const x = Math.random() * 500;
                        const y = Math.random() * 500;
                        const r = Math.random() * 100 + 50;
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // 노이즈 효과
                if (addNoise) {
                    const imageData = ctx.getImageData(0, 0, 500, 500);
                    for (let i = 0; i < imageData.data.length; i += 4) {
                        const noise = Math.random() * 30 - 15;
                        imageData.data[i] += noise;
                        imageData.data[i+1] += noise;
                        imageData.data[i+2] += noise;
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
                
                // 텍스트
                if (textType !== 'none') {
                    let displayText = '';
                    switch(textType) {
                        case 'first':
                            displayText = title.charAt(0).toUpperCase();
                            break;
                        case 'icon':
                            displayText = '🎵';
                            break;
                        case 'custom':
                            displayText = customText || '♪';
                            break;
                    }
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.font = `bold ${textSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (addGlow) {
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                        ctx.shadowBlur = 30;
                    }
                    
                    ctx.fillText(displayText, 250, 250);
                }
                
                // 테두리
                if (addBorder) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 10;
                ctx.strokeRect(5, 5, 490, 490);
            }
            
            canvas.toBlob((blob) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            }, 'image/jpeg', 0.95);
        });
    }

async function downloadYoutubeAudio(youtubeUrl) {
    try {
        // 유튜브 비디오 ID 추출
        let videoId;
        const urlObj = new URL(youtubeUrl);
        if (urlObj.hostname.includes('youtu.be')) {
            videoId = urlObj.pathname.slice(1);
        } else if (urlObj.hostname.includes('youtube.com')) {
            videoId = urlObj.searchParams.get('v');
        }

        if (!videoId) {
            throw new Error('비디오 ID를 찾을 수 없습니다');
        }

        // yt-api.org API 사용
        const apiUrl = `https://yt-api.org/api/json/mp3/${videoId}`;
        
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data || !data.url) {
            throw new Error('다운로드 링크를 가져올 수 없습니다');
        }

        // MP3 다운로드
        const audioResponse = await fetch(data.url);
        const audioBlob = await audioResponse.blob();

        // 크기 체크
        const sizeMB = audioBlob.size / (1024 * 1024);
        if (sizeMB > 4.4) {
            throw new Error(`파일이 너무 큽니다 (${sizeMB.toFixed(2)}MB). 더 짧은 영상을 선택해주세요.`);
        }

        // Base64 변환
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(audioBlob);
        });

    } catch (error) {
        throw new Error('유튜브 다운로드 실패: ' + error.message);
    }
}
    async function uploadFile(file, filename) {
        const base64 = await fileToBase64(file);
        return await uploadToGitHub(filename, base64.split(',')[1]);

    async function uploadBase64(base64, filename) {

    async function uploadToGitHub(filename, base64Content) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                filename: filename,
                content: base64Content
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(`업로드 실패: ${error.error || error.message}`);
        }

        return await response.json();
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
