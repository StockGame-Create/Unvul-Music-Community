<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNVUL MUSIC - 커뮤니티 업로드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .warning {
            background: rgba(255, 100, 100, 0.2);
            border: 2px solid rgba(255, 100, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info {
            background: rgba(100, 200, 255, 0.2);
            border: 2px solid rgba(100, 200, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        input[type="text"],
        input[type="file"],
        input[type="color"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1em;
        }

        input[type="color"] {
            height: 60px;
            cursor: pointer;
        }
        
        input[type="file"] {
            cursor: pointer;
        }
        
        .file-info {
            margin-top: 10px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .color-picker-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .color-preview {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            margin-top: 15px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress {
            display: none;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        
        
        .status {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9em;
        }
        
        .success {
            background: rgba(100, 255, 100, 0.2);
            border: 2px solid rgba(100, 255, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 2px solid rgba(255, 100, 100, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            display: block;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 커뮤니티 노래 업로드</h1>
        
        <div class="warning">
            <h3>⚠️ 이 페이지는 관리자 전용입니다</h3>
            <p>• 절대 이 페이지를 공개하지 마세요</p>
            <p>• GitHub 토큰이 포함되어 있습니다</p>
        </div>
        
        <div class="info">
            <h3>📌 업로드 규칙</h3>
            <p>• MP3 파일만 업로드 가능 (최대 25MB)</p>
            <p>• 앨범 아트는 자동으로 생성됩니다</p>
            <p>• 업로드 후 자동으로 커뮤니티 탭에 표시됩니다</p>
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>노래 제목 *</label>
                <input type="text" id="songTitle" required placeholder="예: MY AWESOME SONG">
            </div>
            
            <div class="form-group">
                <label>MP3 파일 *</label>
                <input type="file" id="mp3File" accept=".mp3" required>
                <div class="file-info" id="mp3Info"></div>
            </div>
            
            <div class="form-group">
                <label>앨범 아트 색상 선택</label>
                <div class="color-picker-group">
                    <div>
                        <label style="font-size: 0.9em;">시작 색상</label>
                        <input type="color" id="color1" value="#ff6b6b">
                    </div>
                    <div>
                        <label style="font-size: 0.9em;">끝 색상</label>
                        <input type="color" id="color2" value="#4ecdc4">
                    </div>
                </div>
                <div class="color-preview" id="colorPreview">🎵</div>
            </div>
            
            <button type="submit" class="btn" id="uploadBtn">🚀 업로드 시작</button>
        </form>
        
        <div class="progress" id="progressDiv">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <div class="status" id="statusText">준비 중...</div>
        </div>
        
        <div class="success" id="successDiv">
            <h3>✅ 업로드 완료!</h3>
            <p id="successMessage"></p>
        </div>
        
        <div class="error" id="errorDiv">
            <h3>❌ 업로드 실패</h3>
            <p id="errorMessage"></p>
        </div>
    </div>

    <script>

             // 개발자 도구 감지 및 차단
        (function() {
            const devtoolsDetector = {
                isOpen: false,
                orientation: null,
                
                check: function() {
                    const widthThreshold = window.outerWidth - window.innerWidth > 160;
                    const heightThreshold = window.outerHeight - window.innerHeight > 160;
                    
                    if (widthThreshold || heightThreshold) {
                        if (!this.isOpen) {
                            this.isOpen = true;
                            this.handleDevtools();
                        }
                    } else {
                        this.isOpen = false;
                    }
                },
                
                handleDevtools: function() {
                    document.body.innerHTML = `
                        <div style="
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            z-index: 999999;
                            font-family: 'Segoe UI', sans-serif;
                        ">
                            <div style="
                                text-align: center;
                                color: white;
                                padding: 40px;
                                background: rgba(0,0,0,0.3);
                                border-radius: 20px;
                                backdrop-filter: blur(10px);
                            ">
                                <div style="font-size: 80px; margin-bottom: 20px;">⚠️</div>
                                <h1 style="font-size: 2.5em; margin-bottom: 20px;">개발자 도구 감지</h1>
                                <p style="font-size: 1.3em; margin-bottom: 15px;">보안을 위해 개발자 도구 사용이 제한됩니다.</p>
                                <p style="font-size: 1.1em; opacity: 0.8;">개발자 도구를 닫으면 페이지가 자동으로 새로고침됩니다.</p>
                            </div>
                        </div>
                    `;
                    setTimeout(() => location.reload(), 3000);
                }
            };
            
            // 정기적으로 체크
            setInterval(() => devtoolsDetector.check(), 1000);
            
            // 우클릭 방지
            document.addEventListener('contextmenu', e => {
                e.preventDefault();
                alert('⚠️ 우클릭이 비활성화되어 있습니다.');
                return false;
            });
            
            // 키보드 단축키 차단
            document.addEventListener('keydown', e => {
                // F12
                if (e.key === 'F12') {
                    e.preventDefault();
                    alert('⚠️ 개발자 도구는 보안상 사용할 수 없습니다.');
                    return false;
                }
                // Ctrl+Shift+I
                if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                    e.preventDefault();
                    alert('⚠️ 개발자 도구는 보안상 사용할 수 없습니다.');
                    return false;
                }
                // Ctrl+Shift+J
                if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                    e.preventDefault();
                    alert('⚠️ 개발자 도구는 보안상 사용할 수 없습니다.');
                    return false;
                }
                // Ctrl+Shift+C
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    alert('⚠️ 개발자 도구는 보안상 사용할 수 없습니다.');
                    return false;
                }
                // Ctrl+U (소스보기)
                if (e.ctrlKey && e.key === 'u') {
                    e.preventDefault();
                    alert('⚠️ 소스 보기는 보안상 사용할 수 없습니다.');
                    return false;
                }
            });
            
            // 디버거 감지
            setInterval(() => {
                const before = new Date();
                debugger;
                const after = new Date();
                if (after - before > 100) {
                    document.body.innerHTML = `
                        <div style="
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            z-index: 999999;
                            font-family: 'Segoe UI', sans-serif;
                        ">
                            <div style="
                                text-align: center;
                                color: white;
                                padding: 40px;
                                background: rgba(0,0,0,0.3);
                                border-radius: 20px;
                                backdrop-filter: blur(10px);
                            ">
                                <div style="font-size: 80px; margin-bottom: 20px;">🚫</div>
                                <h1 style="font-size: 2.5em; margin-bottom: 20px;">디버거 감지</h1>
                                <p style="font-size: 1.3em;">보안을 위해 접근이 차단되었습니다.</p>
                            </div>
                        </div>
                    `;
                    setTimeout(() => location.reload(), 2000);
                }
            }, 1000);
        })();
        // GitHub 설정 (미리 입력됨)
        const GITHUB_CONFIG = {
            username: 'StockGame-Create',
            repo: 'Unvul-Music',
            token: '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'
        };

        // 색상 미리보기 업데이트
        function updateColorPreview() {
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;
            const preview = document.getElementById('colorPreview');
            preview.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
        }

        document.getElementById('color1').addEventListener('input', updateColorPreview);
        document.getElementById('color2').addEventListener('input', updateColorPreview);
        updateColorPreview();

        // 파일 정보 표시
        document.getElementById('mp3File').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                document.getElementById('mp3Info').textContent = `📁 ${file.name} (${sizeMB}MB)`;
                
                // 파일 크기 체크
                if (file.size > 25 * 1024 * 1024) {
                    alert('⚠️ 파일이 너무 큽니다! 25MB 이하만 가능합니다.');
                    e.target.value = '';
                    document.getElementById('mp3Info').textContent = '';
                }
            }
        });

        // 앨범 아트 생성 함수
        async function generateAlbumArt(color1, color2, title) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 400;
                const ctx = canvas.getContext('2d');
                
                // 그라데이션 배경
                const gradient = ctx.createLinearGradient(0, 0, 400, 400);
                gradient.addColorStop(0, color1);
                gradient.addColorStop(1, color2);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 400, 400);
                
                // 무늬 추가 (랜덤 원들)
                for (let i = 0; i < 15; i++) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.15})`;
                    const x = Math.random() * 400;
                    const y = Math.random() * 400;
                    const r = Math.random() * 80 + 40;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // 텍스트 (노래 제목 첫 글자)
                const firstLetter = title.charAt(0).toUpperCase();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.font = 'bold 200px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 20;
                ctx.fillText(firstLetter, 200, 200);
                
                // Base64로 변환
                canvas.toBlob((blob) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                }, 'image/jpeg', 0.9);
            });
        }

        // 폼 제출
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('songTitle').value.trim();
            const mp3File = document.getElementById('mp3File').files[0];
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;

            // UI 업데이트
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('progressDiv').style.display = 'block';
            document.getElementById('successDiv').style.display = 'none';
            document.getElementById('errorDiv').style.display = 'none';

            try {
                // 1. 앨범 아트 생성
                updateProgress(20, '앨범 아트 생성 중...');
                const albumArtBase64 = await generateAlbumArt(color1, color2, title);
                
                // 2. MP3 파일 업로드
                updateProgress(40, 'MP3 파일 업로드 중...');
                const mp3Filename = `community/${title}.mp3`;
                await uploadFile(mp3File, mp3Filename);

                // 3. 앨범 아트 업로드
                updateProgress(70, '앨범 아트 업로드 중...');
                const iconFilename = `community/${title}.jpg`;
                await uploadBase64(albumArtBase64, iconFilename);

                // 4. 완료
                updateProgress(100, '완료!');
                document.getElementById('successDiv').style.display = 'block';
                document.getElementById('successMessage').innerHTML = `
                    <strong>${title}</strong>가 커뮤니티에 추가되었습니다!<br><br>
                    ✅ 자동으로 커뮤니티 탭에 표시됩니다<br>
                    ✅ 추가 작업이 필요하지 않습니다
                `;

                // 폼 리셋
                setTimeout(() => {
                    document.getElementById('uploadForm').reset();
                    document.getElementById('mp3Info').textContent = '';
                    updateColorPreview();
                }, 3000);

            } catch (error) {
                console.error('Upload error:', error);
                document.getElementById('errorDiv').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message;
            } finally {
                document.getElementById('uploadBtn').disabled = false;
            }
        });

        function updateProgress(percent, message) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressFill').textContent = percent + '%';
            document.getElementById('statusText').textContent = message;
        }

        async function uploadFile(file, filename) {
            const base64 = await fileToBase64(file);
            return await uploadToGitHub(filename, base64.split(',')[1]);
        }

        async function uploadBase64(base64, filename) {
            return await uploadToGitHub(filename, base64);
        }

        async function uploadToGitHub(filename, base64Content) {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${filename}`;
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: `Add community song: ${filename}`,
                    content: base64Content,
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(`GitHub API 오류: ${error.message}`);
            }

            return await response.json();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
